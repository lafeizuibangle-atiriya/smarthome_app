[server]
# 后端地址。注意：后端默认端口 6893 被 WorkBuddy 自身占用，
# 手动启动请加参数 --server.port=8080，所以这里默认填 8080。
base_url = http://127.0.0.1:8080
# 用你 App 里真实注册过的账号，模拟器靠它登录拿 token 再上报
username = demo
password = 123456
timeout = 5

[simulator]
# 上报间隔（秒）。后端 SensorSimTask 是每 30 秒抖一次，对齐成 30 最自然
interval = 30
# 是否开启随机事件（人体感应自动开灯 / 烟雾 / 燃气）
enable_events = true
# 每轮触发概率（0~1）
pir_probability = 0.15
smoke_probability = 0.03
gas_probability = 0.02
