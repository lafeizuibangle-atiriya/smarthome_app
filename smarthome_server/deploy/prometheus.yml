# Prometheus 抓取配置（智慧家居监控，2026-11-23）
global:
  scrape_interval: 15s          # 每 15 秒抓一次
  evaluation_interval: 15s

scrape_configs:
  # Spring Boot 应用指标（micrometer-registry-prometheus 暴露在 /actuator/prometheus）
  - job_name: "smarthome-app"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["app:8080"]   # compose 网络里的服务名
        labels:
          application: "smarthome-server"

  # Prometheus 自身运行状态
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
